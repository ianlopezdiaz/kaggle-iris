  description: "A case study in classifying Iris species from flower measurements: EDA, feature engineering, and model comparison, published via Quarto."
  site-url: "https://ianlopezdiaz.github.io/kaggle-iris"
  #favicon: images/favicon.ico # optional - remove if there is none
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Notebooks"
        menu:
          - href: notebooks/01_eda_and_feature_engineering.ipynb
            text: "Exploratory data analysis (EDA) and feature engineering"
          - href: notebooks/02_modeling_and_evaluation.ipynb
            text: "Modeling and Evaluation"
    right:
      - text: Portfolio
        href: https://ianlopezdiaz.github.io/portfolio
      - icon: github
        href: https://github.com/ianlopezdiaz/kaggle-iris

  page-footer:
    left: "(c) 2026 ianlopezdiaz"
    right: "Built with [Quarto](https://quarto.org/)"

format:
  html:
    theme:
      dark: solar
      light: minty
